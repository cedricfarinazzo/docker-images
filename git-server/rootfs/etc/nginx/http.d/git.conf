# Smart-HTTP git endpoint.
# nginx terminates HTTP basic-auth, fcgiwrap (running as the git user)
# execs gitolite-shell. gitolite resolves the same ACL it uses for SSH,
# using REMOTE_USER as the gitolite identity.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    client_max_body_size 0;

    # Bare root: tell the operator they probably want /git.
    location = / {
        default_type text/plain;
        return 200 "git-server\nUse /git/<repo>.git over HTTP, or git@<host>:<repo> over SSH.\n";
    }

    # Smart HTTP. Anything under /git/ goes through gitolite-shell.
    location ~ ^/git(/.*)$ {
        auth_basic           "git";
        auth_basic_user_file /etc/nginx/git.htpasswd;

        # git push payloads can be large.
        client_max_body_size 0;

        fastcgi_pass  unix:/run/fcgiwrap/fcgiwrap.sock;
        fastcgi_read_timeout 600s;
        include       fastcgi_params;

        # gitolite-shell acts dual-mode: when invoked as a CGI script with
        # REMOTE_USER set it routes through git-http-backend with ACLs.
        fastcgi_param SCRIPT_FILENAME    /usr/local/bin/gitolite-http-cgi;
        fastcgi_param PATH_INFO          $1;
        fastcgi_param REMOTE_USER        $remote_user;
        fastcgi_param GIT_PROJECT_ROOT   /var/lib/gitolite/repositories;
        fastcgi_param GITOLITE_HTTP_HOME /var/lib/gitolite;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
    }
}
