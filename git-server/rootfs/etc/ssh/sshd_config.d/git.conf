# sshd configuration for the git-server image.
# Pubkey-only, no passwords, host keys in a persistent volume.

Port 22
Protocol 2
AddressFamily any

HostKey /etc/ssh/host_keys/ssh_host_ed25519_key
HostKey /etc/ssh/host_keys/ssh_host_rsa_key
HostKey /etc/ssh/host_keys/ssh_host_ecdsa_key

PermitRootLogin no
PasswordAuthentication no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
UsePAM no
PubkeyAuthentication yes

# gitolite manages authorized_keys for the git user.
AuthorizedKeysFile /var/lib/gitolite/.ssh/authorized_keys

# Only the git user can log in over SSH.
AllowUsers git
PermitUserEnvironment no
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PrintMotd no
Subsystem sftp internal-sftp
