name: build-py-ta-lib

on:
  push:
    tags:
      - "py-ta-lib-v*.*.*"
  workflow_dispatch:
    inputs:
      semver:
        description: "Semver to build (e.g. 1.0.0). Required for workflow_dispatch."
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cedricfarinazzo/py-ta-lib

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      combo_matrix: ${{ steps.matrix.outputs.combo_matrix }}
      default_python: ${{ steps.matrix.outputs.default_python }}
      default_talib: ${{ steps.matrix.outputs.default_talib }}
      default_distro: ${{ steps.matrix.outputs.default_distro }}
      pythons: ${{ steps.matrix.outputs.pythons }}
      distros: ${{ steps.matrix.outputs.distros }}
      talibs: ${{ steps.matrix.outputs.talibs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Parse semver from tag or dispatch input
        id: parse
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          DISPATCH_SEMVER: ${{ github.event.inputs.semver }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SEMVER="$DISPATCH_SEMVER"
          else
            SEMVER="${REF_NAME#py-ta-lib-v}"
          fi
          if ! echo "$SEMVER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: $SEMVER"
            exit 1
          fi
          MAJOR="${SEMVER%%.*}"
          MINOR_PART="${SEMVER#*.}"
          MINOR_PART="${MINOR_PART%.*}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR"   >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR_PART}" >> "$GITHUB_OUTPUT"

      - name: Build matrix from versions.json
        id: matrix
        run: |
          set -euo pipefail
          F=py-ta-lib/versions.json
          # build_matrix: per-combo per-arch (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm)
          BUILD=$(jq -c '
            [ .python[] as $p | .talib[] as $t | .distros[] as $d |
              { arch: "amd64", runs_on: "ubuntu-latest",   python: $p, talib: $t, distro: $d },
              { arch: "arm64", runs_on: "ubuntu-24.04-arm", python: $p, talib: $t, distro: $d }
            ] | { include: . }
          ' "$F")
          # combo_matrix: per-combo (no arch); used by the merge job
          COMBO=$(jq -c '
            [ .python[] as $p | .talib[] as $t | .distros[] as $d |
              { python: $p, talib: $t, distro: $d } ]
            | { include: . }
          ' "$F")
          echo "build_matrix=$BUILD" >> "$GITHUB_OUTPUT"
          echo "combo_matrix=$COMBO" >> "$GITHUB_OUTPUT"
          echo "default_python=$(jq -r .default_python "$F")" >> "$GITHUB_OUTPUT"
          echo "default_talib=$(jq -r .default_talib "$F")"   >> "$GITHUB_OUTPUT"
          echo "default_distro=$(jq -r .default_distro "$F")" >> "$GITHUB_OUTPUT"
          echo "pythons=$(jq -c .python "$F")"  >> "$GITHUB_OUTPUT"
          echo "distros=$(jq -c .distros "$F")" >> "$GITHUB_OUTPUT"
          echo "talibs=$(jq -c .talib "$F")"    >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: py-ta-lib
          file: py-ta-lib/Dockerfile.${{ matrix.distro }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
            TALIB_VERSION=${{ matrix.talib }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=py-ta-lib-${{ matrix.python }}-${{ matrix.talib }}-${{ matrix.distro }}-${{ matrix.arch }}
          cache-to: type=gha,scope=py-ta-lib-${{ matrix.python }}-${{ matrix.talib }}-${{ matrix.distro }}-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PY: ${{ matrix.python }}
          TA: ${{ matrix.talib }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          DIR="/tmp/digests/py${PY}-ta${TA}-${DISTRO}"
          mkdir -p "$DIR"
          touch "${DIR}/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-py${{ matrix.python }}-ta${{ matrix.talib }}-${{ matrix.distro }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [setup, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.combo_matrix) }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests for this combo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-py${{ matrix.python }}-ta${{ matrix.talib }}-${{ matrix.distro }}-*
          merge-multiple: true

      - name: Create multi-arch manifest with all tags
        env:
          IMAGE: ${{ env.IMAGE }}
          SEMVER: ${{ needs.setup.outputs.semver }}
          MAJOR: ${{ needs.setup.outputs.major }}
          MINOR: ${{ needs.setup.outputs.minor }}
          PY: ${{ matrix.python }}
          TA: ${{ matrix.talib }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          SUFFIX="py${PY}-ta${TA}-${DISTRO}"
          TAG_ARGS=()
          for T in "${SEMVER}-${SUFFIX}" "${MINOR}-${SUFFIX}" "${MAJOR}-${SUFFIX}" "${SUFFIX}"; do
            TAG_ARGS+=( -t "${IMAGE}:${T}" )
          done
          SOURCES=()
          cd /tmp/digests/py${PY}-ta${TA}-${DISTRO}
          for D in *; do
            SOURCES+=( "${IMAGE}@sha256:${D}" )
          done
          if [ ${#SOURCES[@]} -eq 0 ]; then
            echo "::error::No digests found for combo"
            exit 1
          fi
          echo "Creating manifest for ${SUFFIX} with ${#SOURCES[@]} arch(es)"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

  aliases:
    needs: [setup, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rolling aliases
        env:
          IMAGE: ${{ env.IMAGE }}
          SEMVER: ${{ needs.setup.outputs.semver }}
          MAJOR: ${{ needs.setup.outputs.major }}
          MINOR: ${{ needs.setup.outputs.minor }}
          DEF_PY: ${{ needs.setup.outputs.default_python }}
          DEF_TA: ${{ needs.setup.outputs.default_talib }}
          DEF_DI: ${{ needs.setup.outputs.default_distro }}
          PYTHONS: ${{ needs.setup.outputs.pythons }}
          DISTROS: ${{ needs.setup.outputs.distros }}
        run: |
          set -euo pipefail
          alias_to() {
            local SRC=$1; local DST=$2
            echo "alias: ${DST} -> ${SRC}"
            docker buildx imagetools create --tag "${IMAGE}:${DST}" "${IMAGE}:${SRC}"
          }
          DEFAULT_SRC="${SEMVER}-py${DEF_PY}-ta${DEF_TA}-${DEF_DI}"
          alias_to "$DEFAULT_SRC" "latest"
          alias_to "$DEFAULT_SRC" "${SEMVER}"
          alias_to "$DEFAULT_SRC" "${MINOR}"
          alias_to "$DEFAULT_SRC" "${MAJOR}"
          for D in $(echo "$DISTROS" | jq -r '.[]'); do
            SRC="${SEMVER}-py${DEF_PY}-ta${DEF_TA}-${D}"
            alias_to "$SRC" "latest-${D}"
            alias_to "$SRC" "${SEMVER}-${D}"
            alias_to "$SRC" "${MINOR}-${D}"
            alias_to "$SRC" "${MAJOR}-${D}"
          done
          for P in $(echo "$PYTHONS" | jq -r '.[]'); do
            SRC="${SEMVER}-py${P}-ta${DEF_TA}-${DEF_DI}"
            alias_to "$SRC" "latest-py${P}"
          done
          for P in $(echo "$PYTHONS" | jq -r '.[]'); do
            for D in $(echo "$DISTROS" | jq -r '.[]'); do
              SRC="${SEMVER}-py${P}-ta${DEF_TA}-${D}"
              alias_to "$SRC" "latest-py${P}-${D}"
            done
          done

      - name: Verify multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          for T in latest latest-debian latest-alpine; do
            echo "=== ${T} ==="
            docker buildx imagetools inspect "${IMAGE}:${T}" | tee "/tmp/${T}.txt"
            grep -q 'linux/amd64' "/tmp/${T}.txt"
            grep -q 'linux/arm64' "/tmp/${T}.txt"
          done
