name: nightly-actions-runner

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-actions-runner
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cedricfarinazzo/actions-runner

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      date: ${{ steps.matrix.outputs.date }}
      runner_version: ${{ steps.matrix.outputs.runner_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build matrix
        id: matrix
        run: |
          set -euo pipefail
          F=actions-runner/versions.json
          BUILD=$(jq -cn '
            [
              { arch: "amd64", runs_on: "ubuntu-latest" },
              { arch: "arm64", runs_on: "ubuntu-24.04-arm" }
            ] | { include: . }
          ')
          echo "build_matrix=$BUILD" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "runner_version=$(jq -r .runner_version "$F")" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (no cache)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: actions-runner
          file: actions-runner/Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          provenance: false
          build-args: |
            RUNNER_VERSION=${{ needs.setup.outputs.runner_version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/runner
          touch "/tmp/digests/runner/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create multi-arch manifest with nightly tags
        env:
          IMAGE: ${{ env.IMAGE }}
          DATE: ${{ needs.setup.outputs.date }}
        run: |
          set -euo pipefail
          TAG_ARGS=( -t "${IMAGE}:nightly" -t "${IMAGE}:nightly-${DATE}" )
          SOURCES=()
          cd /tmp/digests/runner
          for D in *; do
            SOURCES+=( "${IMAGE}@sha256:${D}" )
          done
          if [ ${#SOURCES[@]} -eq 0 ]; then
            echo "::error::No digests found"
            exit 1
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
