name: nightly-py-ta-lib

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-py-ta-lib
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cedricfarinazzo/py-ta-lib

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      combo_matrix: ${{ steps.matrix.outputs.combo_matrix }}
      date: ${{ steps.matrix.outputs.date }}
      default_python: ${{ steps.matrix.outputs.default_python }}
      default_talib: ${{ steps.matrix.outputs.default_talib }}
      default_distro: ${{ steps.matrix.outputs.default_distro }}
      pythons: ${{ steps.matrix.outputs.pythons }}
      distros: ${{ steps.matrix.outputs.distros }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build matrix from versions.json
        id: matrix
        run: |
          set -euo pipefail
          F=py-ta-lib/versions.json
          BUILD=$(jq -c '
            [ .python[] as $p | .talib[] as $t | .distros[] as $d |
              { arch: "amd64", runs_on: "ubuntu-latest",   python: $p, talib: $t, distro: $d },
              { arch: "arm64", runs_on: "ubuntu-24.04-arm", python: $p, talib: $t, distro: $d }
            ] | { include: . }
          ' "$F")
          COMBO=$(jq -c '
            [ .python[] as $p | .talib[] as $t | .distros[] as $d |
              { python: $p, talib: $t, distro: $d } ]
            | { include: . }
          ' "$F")
          echo "build_matrix=$BUILD" >> "$GITHUB_OUTPUT"
          echo "combo_matrix=$COMBO" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "default_python=$(jq -r .default_python "$F")" >> "$GITHUB_OUTPUT"
          echo "default_talib=$(jq -r .default_talib "$F")"   >> "$GITHUB_OUTPUT"
          echo "default_distro=$(jq -r .default_distro "$F")" >> "$GITHUB_OUTPUT"
          echo "pythons=$(jq -c .python "$F")"  >> "$GITHUB_OUTPUT"
          echo "distros=$(jq -c .distros "$F")" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (no cache)
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: py-ta-lib
          file: py-ta-lib/Dockerfile.${{ matrix.distro }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          provenance: false
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
            TALIB_VERSION=${{ matrix.talib }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PY: ${{ matrix.python }}
          TA: ${{ matrix.talib }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          DIR="/tmp/digests/py${PY}-ta${TA}-${DISTRO}"
          mkdir -p "$DIR"
          touch "${DIR}/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-py${{ matrix.python }}-ta${{ matrix.talib }}-${{ matrix.distro }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [setup, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.combo_matrix) }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests for this combo
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-py${{ matrix.python }}-ta${{ matrix.talib }}-${{ matrix.distro }}-*
          merge-multiple: true

      - name: Create multi-arch manifest with nightly tags
        env:
          IMAGE: ${{ env.IMAGE }}
          DATE: ${{ needs.setup.outputs.date }}
          PY: ${{ matrix.python }}
          TA: ${{ matrix.talib }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          SUFFIX="py${PY}-ta${TA}-${DISTRO}"
          TAG_ARGS=( -t "${IMAGE}:nightly-${SUFFIX}" -t "${IMAGE}:nightly-${DATE}-${SUFFIX}" )
          SOURCES=()
          cd /tmp/digests/py${PY}-ta${TA}-${DISTRO}
          for D in *; do
            SOURCES+=( "${IMAGE}@sha256:${D}" )
          done
          if [ ${#SOURCES[@]} -eq 0 ]; then
            echo "::error::No digests found for combo"
            exit 1
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

  aliases:
    needs: [setup, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly rolling aliases
        env:
          IMAGE: ${{ env.IMAGE }}
          DEF_PY: ${{ needs.setup.outputs.default_python }}
          DEF_TA: ${{ needs.setup.outputs.default_talib }}
          DEF_DI: ${{ needs.setup.outputs.default_distro }}
          PYTHONS: ${{ needs.setup.outputs.pythons }}
          DISTROS: ${{ needs.setup.outputs.distros }}
        run: |
          set -euo pipefail
          alias_to() {
            local SRC=$1; local DST=$2
            echo "alias: ${DST} -> ${SRC}"
            docker buildx imagetools create --tag "${IMAGE}:${DST}" "${IMAGE}:${SRC}"
          }
          DEFAULT_SRC="nightly-py${DEF_PY}-ta${DEF_TA}-${DEF_DI}"
          alias_to "$DEFAULT_SRC" "nightly"
          for D in $(echo "$DISTROS" | jq -r '.[]'); do
            alias_to "nightly-py${DEF_PY}-ta${DEF_TA}-${D}" "nightly-${D}"
          done
          for P in $(echo "$PYTHONS" | jq -r '.[]'); do
            alias_to "nightly-py${P}-ta${DEF_TA}-${DEF_DI}" "nightly-py${P}"
          done
