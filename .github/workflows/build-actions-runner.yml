name: build-actions-runner

on:
  push:
    tags:
      - "actions-runner-v*.*.*"
  workflow_dispatch:
    inputs:
      semver:
        description: "Semver to build (e.g. 1.0.0). Required for workflow_dispatch."
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cedricfarinazzo/actions-runner

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Parse semver from tag or dispatch input
        id: parse
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          DISPATCH_SEMVER: ${{ github.event.inputs.semver }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SEMVER="$DISPATCH_SEMVER"
          else
            SEMVER="${REF_NAME#actions-runner-v}"
          fi
          if ! echo "$SEMVER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: $SEMVER"
            exit 1
          fi
          MAJOR="${SEMVER%%.*}"
          MINOR_PART="${SEMVER#*.}"
          MINOR_PART="${MINOR_PART%.*}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR"   >> "$GITHUB_OUTPUT"
          echo "minor=${MAJOR}.${MINOR_PART}" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        run: |
          set -euo pipefail
          BUILD=$(jq -cn '
            [
              { arch: "amd64", runs_on: "ubuntu-latest" },
              { arch: "arm64", runs_on: "ubuntu-24.04-arm" }
            ] | { include: . }
          ')
          echo "build_matrix=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: actions-runner
          file: actions-runner/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=actions-runner-${{ matrix.arch }}
          cache-to: type=gha,scope=actions-runner-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/runner
          touch "/tmp/digests/runner/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create multi-arch manifest with all tags
        env:
          IMAGE: ${{ env.IMAGE }}
          SEMVER: ${{ needs.setup.outputs.semver }}
          MAJOR: ${{ needs.setup.outputs.major }}
          MINOR: ${{ needs.setup.outputs.minor }}
        run: |
          set -euo pipefail
          TAG_ARGS=()
          for T in "${SEMVER}" "${MINOR}" "${MAJOR}" "latest"; do
            TAG_ARGS+=( -t "${IMAGE}:${T}" )
          done
          SOURCES=()
          cd /tmp/digests/runner
          for D in *; do
            SOURCES+=( "${IMAGE}@sha256:${D}" )
          done
          if [ ${#SOURCES[@]} -eq 0 ]; then
            echo "::error::No digests found"
            exit 1
          fi
          echo "Creating manifest with ${#SOURCES[@]} arch(es)"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

  verify:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Verify multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          echo "=== latest ==="
          docker buildx imagetools inspect "${IMAGE}:latest" | tee /tmp/latest.txt
          grep -q 'linux/amd64' /tmp/latest.txt
          grep -q 'linux/arm64' /tmp/latest.txt
