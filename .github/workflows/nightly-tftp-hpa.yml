name: nightly-tftp-hpa

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-tftp-hpa
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cedricfarinazzo/tftp-hpa

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      combo_matrix: ${{ steps.matrix.outputs.combo_matrix }}
      date: ${{ steps.matrix.outputs.date }}
      default_alpine: ${{ steps.matrix.outputs.default_alpine }}
      alpines: ${{ steps.matrix.outputs.alpines }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build matrix from versions.json
        id: matrix
        run: |
          set -euo pipefail
          F=tftp-hpa/versions.json
          BUILD=$(jq -c '
            [ .alpine[] as $a |
              { arch: "amd64", runs_on: "ubuntu-latest",   alpine: $a },
              { arch: "arm64", runs_on: "ubuntu-24.04-arm", alpine: $a }
            ] | { include: . }
          ' "$F")
          COMBO=$(jq -c '
            [ .alpine[] as $a | { alpine: $a } ]
            | { include: . }
          ' "$F")
          echo "build_matrix=$BUILD" >> "$GITHUB_OUTPUT"
          echo "combo_matrix=$COMBO" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "default_alpine=$(jq -r .default_alpine "$F")" >> "$GITHUB_OUTPUT"
          echo "alpines=$(jq -c .alpine "$F")" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (no cache)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tftp-hpa
          file: tftp-hpa/Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          provenance: false
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ALPINE: ${{ matrix.alpine }}
        run: |
          set -euo pipefail
          DIR="/tmp/digests/alpine${ALPINE}"
          mkdir -p "$DIR"
          touch "${DIR}/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-alpine${{ matrix.alpine }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [setup, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.combo_matrix) }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests for this combo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-alpine${{ matrix.alpine }}-*
          merge-multiple: true

      - name: Create multi-arch manifest with nightly tags
        env:
          IMAGE: ${{ env.IMAGE }}
          DATE: ${{ needs.setup.outputs.date }}
          ALPINE: ${{ matrix.alpine }}
        run: |
          set -euo pipefail
          SUFFIX="alpine${ALPINE}"
          TAG_ARGS=( -t "${IMAGE}:nightly-${SUFFIX}" -t "${IMAGE}:nightly-${DATE}-${SUFFIX}" )
          SOURCES=()
          cd /tmp/digests/alpine${ALPINE}
          for D in *; do
            SOURCES+=( "${IMAGE}@sha256:${D}" )
          done
          if [ ${#SOURCES[@]} -eq 0 ]; then
            echo "::error::No digests found for combo"
            exit 1
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

  aliases:
    needs: [setup, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly rolling aliases
        env:
          IMAGE: ${{ env.IMAGE }}
          DEF_ALPINE: ${{ needs.setup.outputs.default_alpine }}
          ALPINES: ${{ needs.setup.outputs.alpines }}
        run: |
          set -euo pipefail
          alias_to() {
            local SRC=$1; local DST=$2
            echo "alias: ${DST} -> ${SRC}"
            docker buildx imagetools create --tag "${IMAGE}:${DST}" "${IMAGE}:${SRC}"
          }
          DEFAULT_SRC="nightly-alpine${DEF_ALPINE}"
          alias_to "$DEFAULT_SRC" "nightly"
