name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Release each workspace package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$PWD"
          PKGS=$(jq -r '.workspaces[]' package.json)
          for PKG in $PKGS; do
            echo "::group::semantic-release for ${PKG}"
            cd "$ROOT/$PKG"
            bunx semantic-release
            cd "$ROOT"
            echo "::endgroup::"
          done

      - name: Dispatch per-image build workflows for new tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          PKGS=$(jq -r '.workspaces[]' package.json)
          for PKG in $PKGS; do
            TAG=$(git tag --list "${PKG}-v*" --sort=-version:refname | head -n1)
            [ -z "$TAG" ] && { echo "no tag for ${PKG}, skipping"; continue; }
            COMMIT_AT_TAG=$(git rev-list -n1 "$TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$COMMIT_AT_TAG" != "$HEAD_COMMIT" ]; then
              echo "tag ${TAG} not at HEAD (predates this run), skipping"
              continue
            fi
            SEMVER="${TAG#${PKG}-v}"
            echo "Dispatching build-${PKG}.yml for ${TAG} (semver=${SEMVER})"
            gh workflow run "build-${PKG}.yml" \
              --repo "${{ github.repository }}" \
              --ref "$TAG" \
              -f semver="$SEMVER"
          done
