name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Snapshot tags before release
        run: git tag -l | sort > "$RUNNER_TEMP/tags_before.txt"

      - name: Release each workspace package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$PWD"
          PKGS=$(jq -r '.workspaces[]' package.json)
          for PKG in $PKGS; do
            echo "::group::semantic-release for ${PKG}"
            cd "$ROOT/$PKG"
            bunx semantic-release
            cd "$ROOT"
            echo "::endgroup::"
          done

      - name: Dispatch per-image build workflows for new tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Tags created during this run = current tags minus the pre-release
          # snapshot. Using the snapshot (rather than "tag == HEAD") is what
          # lets every bumped image dispatch: each @semantic-release/git commit
          # advances HEAD, so when 2+ images bump only the last tag would sit
          # at HEAD and the rest would be skipped.
          NEW_TAGS=$(comm -13 "$RUNNER_TEMP/tags_before.txt" <(git tag -l | sort))
          if [ -z "$NEW_TAGS" ]; then
            echo "No new tags this run; nothing to dispatch."
            exit 0
          fi

          # Valid dispatch targets are <workspace>-v<semver> tags only.
          PKGS=$(jq -r '.workspaces[]' package.json)
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            PKG="${TAG%-v*}"
            SEMVER="${TAG##*-v}"
            if ! echo "$PKGS" | grep -qxF "$PKG"; then
              echo "tag ${TAG}: '${PKG}' is not a workspace, skipping"
              continue
            fi
            if ! echo "$SEMVER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "tag ${TAG}: '${SEMVER}' is not a plain semver, skipping"
              continue
            fi
            echo "Dispatching build-${PKG}.yml for ${TAG} (semver=${SEMVER})"
            gh workflow run "build-${PKG}.yml" \
              --repo "$REPO" \
              --ref "$TAG" \
              -f semver="$SEMVER"
          done <<< "$NEW_TAGS"
