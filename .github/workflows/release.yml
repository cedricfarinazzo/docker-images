name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile || bun install

      - name: Release each workspace package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$PWD"
          PKGS=$(jq -r '.workspaces[]' package.json)
          for PKG in $PKGS; do
            echo "::group::semantic-release for ${PKG}"
            cd "$ROOT/$PKG"
            bunx semantic-release
            cd "$ROOT"
            echo "::endgroup::"
          done
